name: LanguageHackiOS
options:
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_BUNDLE_IDENTIFIER: com.languagehack.learnly.ios
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    TARGETED_DEVICE_FAMILY: "1,2"
packages: {}
targets:
  LanguageHackiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LanguageHackiOS/Sources
    resources:
      - path: LanguageHackiOS/Resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: LanguageHack
        PRODUCT_BUNDLE_IDENTIFIER: com.languagehack.learnly.ios
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  LanguageHackiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LanguageHackiOSTests
    dependencies:
      - target: LanguageHackiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.languagehack.learnly.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  LanguageHackiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: LanguageHackiOSUITests
    dependencies:
      - target: LanguageHackiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.languagehack.learnly.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
