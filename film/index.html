<title>Стратегия</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Анимированный фильм в семи актах о стратегии создания великого: окружение, эксперименты, сигнал, фокус, топливо, система.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@200;300;500;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&text=%E6%9C%BA%E4%BC%9A%E4%B8%AD%E6%96%87&display=swap">
<style>
  /* Кинозал: кадр 16:9 в центре тёмного зала, служебные подписи — моноширинным шрифтом, как HUD внутри фильма */
  :root {
    --ink: #04060b;
    --hall: #080b13;
    --hair: rgba(127, 208, 255, 0.16);
    --text: #ece6d8;
    --muted: #8a92a6;
    --gold: #ffb246;
    --steel: #7fd0ff;
    --f-display: "Unbounded", "Arial Black", sans-serif;
    --f-mono: "JetBrains Mono", Menlo, Consolas, monospace;
    --frame-w: min(100%, calc((100vh - 96px) * 16 / 9));
    color-scheme: dark;
  }
  @supports (height: 100dvh) {
    :root { --frame-w: min(100%, calc((100dvh - 96px) * 16 / 9)); }
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    box-sizing: border-box;
    background: radial-gradient(120% 90% at 50% 40%, var(--hall), var(--ink) 70%) var(--ink);
    color: var(--text);
    font-family: var(--f-mono);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
    display: grid;
    place-items: center;
    overflow-x: hidden;
  }
  .wrap { width: var(--frame-w); max-width: 100%; display: grid; gap: 12px; min-width: 0; }

  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    max-width: 100%;
    background: #000;
    overflow: hidden;
    border-radius: 3px;
    box-shadow: 0 0 0 1px var(--hair), 0 40px 140px rgba(0, 0, 0, 0.7);
    -webkit-user-select: none;
    user-select: none;
  }
  .frame:fullscreen { border-radius: 0; box-shadow: none; width: 100vw; height: 100vh; }
  .frame:-webkit-full-screen { width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .frame.is-idle, .frame.is-idle canvas { cursor: none; }

  .cover {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: clamp(8px, 1.4vw, 16px);
    padding-bottom: 6.5%;
    background: linear-gradient(rgba(4, 6, 11, 0) 58%, rgba(4, 6, 11, 0.6));
  }
  .play-big {
    position: relative;
    width: clamp(52px, 7vw, 86px);
    aspect-ratio: 1;
    max-width: 100%;
    border-radius: 50%;
    border: 1px solid rgba(255, 178, 70, 0.65);
    background: rgba(4, 6, 11, 0.45);
    color: var(--gold);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: transform 0.25s ease, background 0.25s ease;
  }
  .play-big svg { width: 34%; height: 34%; margin-left: 8%; }
  .play-big .ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(255, 178, 70, 0.3);
    animation: ring 2.6s ease-out infinite;
  }
  .play-big:disabled { cursor: progress; opacity: 0.55; }
  .play-big:disabled .ring { animation: none; opacity: 0; }
  .play-big:not(:disabled):hover { transform: scale(1.06); background: rgba(255, 178, 70, 0.14); }
  .play-big:focus-visible, .ctl:focus-visible, .mark:focus-visible, .timeline:focus-visible { outline: 2px solid var(--steel); outline-offset: 3px; }
  @keyframes ring { from { transform: scale(0.92); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .cover-meta {
    display: grid;
    justify-items: center;
    gap: 6px;
    font-size: clamp(9px, 1vw, 12px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }
  #status { color: var(--gold); }

  .controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.2vw, 14px);
    padding: 30px clamp(8px, 1.6vw, 18px) clamp(6px, 1vw, 12px);
    background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.78));
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  .cover[hidden] ~ .controls { opacity: 1; pointer-events: auto; }
  .frame.is-idle .controls { opacity: 0; pointer-events: none; }
  .ctl {
    flex: none;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .ctl:hover { color: var(--gold); }
  .ctl svg { width: 18px; height: 18px; }
  .i-pause, .frame.is-playing .i-play, .i-muted, .frame.is-muted .i-sound { display: none; }
  .frame.is-playing .i-pause, .frame.is-muted .i-muted { display: block; }

  .timeline { position: relative; flex: 1; min-width: 0; height: 34px; cursor: pointer; touch-action: none; }
  .track { position: absolute; left: 0; right: 0; bottom: 11px; height: 3px; background: rgba(236, 230, 216, 0.18); border-radius: 2px; }
  .fill { height: 100%; width: 0; background: var(--gold); border-radius: 2px; box-shadow: 0 0 10px rgba(255, 178, 70, 0.6); }
  .marks { position: absolute; inset: 0; pointer-events: none; }
  .mark {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    padding: 0 3px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 500 10px/1 var(--f-mono);
    letter-spacing: 0.05em;
    cursor: pointer;
    pointer-events: auto;
  }
  .mark::after { content: ""; display: block; width: 1px; height: 9px; margin: 3px auto 0; background: rgba(236, 230, 216, 0.35); }
  .mark:hover { color: var(--gold); }
  .time { flex: none; font-size: 12px; letter-spacing: 0.08em; color: var(--muted); font-variant-numeric: tabular-nums; }

  .caption {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 24px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    min-width: 0;
  }
  .caption b { font: 300 13px/1 var(--f-display); letter-spacing: 0.5em; color: var(--text); margin-right: 14px; }
  .caption kbd { font: inherit; color: var(--text); }

  @media (max-width: 560px) {
    .time { display: none; }
    .caption { letter-spacing: 0.14em; }
    .caption .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .play-big .ring { animation: none; }
  }
</style>

<main class="wrap">
  <div class="frame" id="frame">
    <canvas id="film" width="1920" height="1080" aria-label="Фильм «Стратегия»"></canvas>
    <audio id="score" src="audio/strategy.m4a" preload="auto"></audio>
    <div class="cover" id="cover">
      <button class="play-big" id="bigPlay" type="button" disabled aria-label="Звук ещё готовится">
        <span class="ring" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5v17L20 12z" fill="currentColor"/></svg>
      </button>
      <div class="cover-meta">
        <span id="status" role="status">Загружаю шрифты</span>
        <span>7 актов · 3:30 · со звуком</span>
      </div>
    </div>
    <div class="controls" id="controls">
      <button class="ctl" id="playBtn" type="button" aria-label="Смотреть">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16l14-8z" fill="currentColor"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>
      </button>
      <div class="timeline" id="timeline" role="slider" tabindex="0" aria-label="Перемотка" aria-valuemin="0" aria-valuemax="210" aria-valuenow="0">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="marks" id="marks"></div>
      </div>
      <span class="time" id="time">0:00 / 3:30</span>
      <button class="ctl" id="muteBtn" type="button" aria-label="Выключить звук">
        <svg class="i-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="ctl" id="fsBtn" type="button" aria-label="Полный экран">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
  </div>
  <footer class="caption">
    <span><b>СТРАТЕГИЯ</b>фильм в семи актах</span>
    <span class="keys"><kbd>Пробел</kbd> пауза · <kbd>←/→</kbd> 5 с · <kbd>F</kbd> экран · <kbd>M</kbd> звук</span>
  </footer>
</main>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/scenes.js"></script>
<script src="js/player.js"></script>
