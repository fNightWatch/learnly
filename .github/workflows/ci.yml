name: Cross-Platform CI

on:
  push:
    branches:
      - main
    paths:
      - "learnly windows/**"
      - ".github/workflows/ci.yml"
      - ".gitattributes"
      - ".gitignore"
  pull_request:
    paths:
      - "learnly windows/**"
      - ".github/workflows/ci.yml"
      - ".gitattributes"
      - ".gitignore"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        working-directory: "learnly windows"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "learnly windows/.nvmrc"
          cache: "npm"
          cache-dependency-path: "learnly windows/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Doctor
        run: npm run doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
